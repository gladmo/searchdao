<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>寻道修仙 - 修仙放置游戏</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="game-container">
        <!-- Top Bar: Character Info -->
        <div class="top-bar">
            <div class="character-info">
                <div class="avatar">🐭</div>
                <div class="player-info">
                    <div class="player-name">历飞雨</div>
                    <div class="currency">
                        <span class="spirit-stone">💎 <span id="spiritStone">0</span></span>
                        <span class="crystal">🔷 <span id="crystal">1142</span></span>
                    </div>
                </div>
            </div>
            <div class="combat-power">
                <span class="power-icon">🔥</span>
                <span class="power-value" id="combatPower">0</span>
            </div>
        </div>

        <!-- Notification Area -->
        <div class="notification" id="notification"></div>

        <!-- Main Game Area: Tree Chopping -->
        <div class="game-area">
            <div class="tree-container">
                <div class="tree" id="tree">🌳</div>
                <div class="character">🐭⛏️</div>
            </div>
        </div>

        <!-- Cultivation Level -->
        <div class="level-display">
            <span id="cultivationLevel">1级·炼气前期·一阶</span>
            <span class="level-up-indicator" id="levelUpIndicator"></span>
        </div>

        <!-- Stamina Bar -->
        <div class="stamina-container">
            <div class="stamina-label">修为: <span id="staminaCurrent">50</span>/<span id="staminaMax">50</span></div>
            <div class="stamina-bar">
                <div class="stamina-fill" id="staminaFill"></div>
            </div>
            <button class="wave-button" id="waveButton">波劫</button>
        </div>

        <!-- Stats Display -->
        <div class="stats-display">
            <div class="stat">攻击:<span id="attack">0</span></div>
            <div class="stat">生命:<span id="life">100</span></div>
            <div class="stat">防御:<span id="defense">0</span></div>
            <div class="stat">敏捷:<span id="agility">0</span></div>
        </div>

        <!-- Equipment Inventory -->
        <div class="equipment-container">
            <div class="equipment-grid" id="equipmentGrid">
                <!-- Equipment slots will be generated by JS -->
            </div>
            <div class="equipment-actions">
                <div class="spirit-display">
                    <span>灵兽</span>
                    <span id="spiritBeast">🐉</span>
                </div>
                <div class="feature-buttons">
                    <button class="feature-btn" id="recordBtn">精怪</button>
                    <button class="feature-btn" id="pulseBtn">灵脉</button>
                    <button class="feature-btn" id="treasureBtn">法宝</button>
                    <button class="feature-btn disabled">座驾</button>
                </div>
            </div>
        </div>

        <!-- Bottom Actions -->
        <div class="bottom-actions">
            <div class="disassemble-info">
                <span class="disassemble-icon">♻️</span>
                <span>分解装备获得<span id="disassembleReward">0</span>个灵石(<span id="disassembleCount">0</span>/100)</span>
            </div>
            <button class="action-btn chop-btn" id="chopBtn">
                <span class="btn-icon">🪓</span>
                <span class="stamina-cost" id="staminaCost">1</span>
            </button>
            <div class="auto-actions">
                <button class="toggle-btn" id="autoEquipBtn">
                    <span>自动</span>
                    <span class="toggle-status">OFF</span>
                </button>
                <button class="info-btn" id="levelInfoBtn">等级</button>
            </div>
        </div>

        <!-- Bottom Navigation -->
        <div class="bottom-nav">
            <button class="nav-btn">妖盟</button>
            <button class="nav-btn">洞府</button>
            <button class="nav-btn active">砍树</button>
            <button class="nav-btn">挑战</button>
            <button class="nav-btn">冒险</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>

</html>
